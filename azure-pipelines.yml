trigger:
  - main

stages:
  - stage: Build
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu_latest'
        steps:
          - task: Npm@1
            inputs:
             command: 'install'
          - task: Npm@1
            inputs:
              command: 'custom'
              customCommand: 'run build'
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'build'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: Deploy
    jobs:
      - job: Deploy
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadFileshareArtifacts@1
            inputs:
              filesharePath: 'build'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'
          
  